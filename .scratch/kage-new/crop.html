<!doctype html><meta charset="utf-8"><body style="margin:0;background:#8a8f9c">
<script>
const Q=new URLSearchParams(location.search);const vb=(Q.get('vb')||'560 130 800 760');
fetch('ref.svg').then(r=>r.text()).then(t=>{t=t.replace(/width="1536" height="1024" viewBox="0 0 1536 1024"/,'width="100%" height="100%" viewBox="'+vb+'"');document.body.insertAdjacentHTML('beforeend','<div style="width:100vw;height:100vh">'+t.replace(/<\?xml[^>]*\?>/,'')+'</div>');document.title='ok';});
</script>
